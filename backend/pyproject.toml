[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-de-datos"
version = "0.2.0"
description = "Atlas de Datos: documentos que describen información convertidos en un grafo de conocimiento navegable (AGF) y en memoria para agentes de IA."
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = ["python-docx>=1.1", "jsonschema>=4.21", "pyyaml>=6", "openpyxl>=3.1"]

[project.optional-dependencies]
ai = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "playwright>=1.45"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

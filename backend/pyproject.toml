[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-de-datos"
version = "0.2.0"
description = "Atlas de Datos: documentos que describen información convertidos en un grafo de conocimiento navegable (AGF) y en memoria para agentes de IA."
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = ["python-docx>=1.1", "jsonschema>=4.21", "pyyaml>=6", "openpyxl>=3.1", "numpy>=1.26"]

[project.optional-dependencies]
ai = ["sentence-transformers>=3.0"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "playwright>=1.45", "httpx>=0.27", "fastapi>=0.115", "sqlalchemy>=2.0", "python-multipart>=0.0.9"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
